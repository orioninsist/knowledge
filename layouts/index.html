{{ define "main" }}

<section class="home-dashboard">

  <section
    class="home-block knowledge-stats"
    id="knowledge-stats"
  >
    <div class="home-headline">
      <div>
        <p class="eyebrow">Local Knowledge</p>
        <h1>Statistics</h1>
      </div>

      <div class="home-routes" aria-label="Knowledge routes">
        <a href="/">Notes</a>
        <a href="/productivity/">Productivity</a>
        <a href="http://127.0.0.1:1320/">Documentation</a>
      </div>
    </div>

    <div class="stats-grid">
      <span>
        <strong>Total</strong>
        <b id="stat-total-notes">-</b>
      </span>

      <span>
        <strong>Inbox</strong>
        <b id="stat-inbox">-</b>
      </span>

      <span>
        <strong>Projects</strong>
        <b id="stat-projects">-</b>
      </span>

      <span>
        <strong>Areas</strong>
        <b id="stat-areas">-</b>
      </span>

      <span>
        <strong>Resources</strong>
        <b id="stat-resources">-</b>
      </span>

      <span>
        <strong>Archives</strong>
        <b id="stat-archives">-</b>
      </span>

      <span>
        <strong>Tags</strong>
        <b id="stat-unique-tags">-</b>
      </span>

      <span>
        <strong>Tag Uses</strong>
        <b id="stat-tag-uses">-</b>
      </span>

      <span>
        <strong>Todo</strong>
        <b id="stat-status-todo">-</b>
      </span>

      <span>
        <strong>In Progress</strong>
        <b id="stat-status-in-progress">-</b>
      </span>

      <span>
        <strong>Review</strong>
        <b id="stat-status-review">-</b>
      </span>

      <span>
        <strong>Done</strong>
        <b id="stat-status-done">-</b>
      </span>

      <span>
        <strong>Size</strong>
        <b id="stat-total-size">-</b>
      </span>
    </div>
  </section>

</section>

{{ end }}
