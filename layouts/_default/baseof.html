<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="knowledge-search-api" content="{{ .Site.Params.searchEndpoint }}">
  <title>{{- if .IsHome -}}{{ .Site.Title }}{{- else -}}{{ .Title }} · {{ .Site.Title }}{{- end -}}</title>
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/tags.css">
  <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
  {{ partial "header.html" . }}

  

<main class="main">{{ block "main" . }}{{ end }}</main>

<div id="command-search" class="command-search" hidden>
  <div class="command-search-backdrop"></div>

  <section class="command-search-panel">

    <input
      id="knowledge-search"
      class="command-search-input"
      type="search"
      placeholder="Search..."
      autocomplete="off"
    >

    <div id="search-results"></div>

  </section>
</div>



</div>


  <script src="/js/search.js" defer></script>
  <script src="/js/note-preview.js" defer></script>
  <script src="/js/copy-link.js" defer></script>
  <script src="/js/keyboard-shortcuts.js" defer></script>
  <script src="/js/reading-progress.js" defer></script>
  <script src="/js/visual-renderers.js" defer></script>
  <script src="/js/canvas-renderer.js" defer></script>
</body>
</html>
