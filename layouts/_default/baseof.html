<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">

  <meta
    name="knowledge-search-api"
    content="{{ .Site.Params.searchEndpoint }}"
  >

  <title>
    {{- if .IsHome -}}
      {{ .Site.Title }}
    {{- else -}}
      {{ .Title }} · {{ .Site.Title }}
    {{- end -}}
  </title>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/tags.css">
  <link rel="icon" type="image/png" href="/favicon.png">
</head>

<body>

  <main class="main">
    {{ block "main" . }}{{ end }}
  </main>

  <div
    id="command-search"
    class="command-search"
    hidden
  >
    <div
      class="command-search-backdrop"
      data-command-search-close
    ></div>

    <section
      class="command-search-panel"
      role="dialog"
      aria-modal="true"
      aria-label="Search notes"
    >

      <label
        class="visually-hidden"
        for="knowledge-search"
      >
        Search notes
      </label>

      <input
        id="knowledge-search"
        class="search-input command-search-input"
        type="search"
        placeholder="Search notes..."
        autocomplete="off"
        spellcheck="false"
        aria-label="Search notes"
      >

      <div
        id="search-results"
        class="search-results command-search-results"
        hidden
      >
        <div
          id="search-summary"
          class="search-summary"
          hidden
        ></div>

        <div
          id="search-results-list"
          class="search-results-list"
        ></div>
      </div>

    </section>
  </div>

  <script src="/js/search.js" defer></script>
  <script src="/js/note-preview.js" defer></script>
  <script src="/js/copy-link.js" defer></script>
  <script src="/js/keyboard-shortcuts.js" defer></script>
  <script src="/js/reading-progress.js" defer></script>
    <script src="/js/visual-renderers.js" defer></script>


  <script
    src="/js/home-stats.js"
    defer
  ></script>

</body>
</html>
