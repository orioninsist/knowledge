<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Knowledge Productivity</title>
  <link rel="stylesheet" href="./app.css">
  <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="/" aria-label="Knowledge home">
        <span class="brand-mark">K</span>
        <strong>Productivity</strong>
      </a>
      <nav class="nav" aria-label="Productivity tools">
        <a class="nav-item nav-link" href="/" aria-label="Knowledge notes">Notes</a>
        <a class="nav-item nav-link" href="http://127.0.0.1:1320/" aria-label="Documentation browser">Docs</a>
        <button class="nav-item is-active" data-view="clock">World Clock</button>
        <button class="nav-item" data-view="weather">Weather</button>
        <button class="nav-item" data-view="prayer">Prayer</button>
        <button class="nav-item" data-view="focus">Focus</button>
      </nav>
      <time id="now"></time>
    </header>

    <main class="main">
      <header class="topbar">
        <div>
          <p id="eyebrow">WORLD CLOCK</p>
          <h1 id="title">Time across your cities.</h1>
        </div>
      </header>
      <section id="workspace" class="workspace" aria-live="polite"></section>
    </main>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
