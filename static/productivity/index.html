<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Knowledge Productivity</title>
  <link rel="stylesheet" href="/productivity/app.css">
  <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="Knowledge home"><span class="brand-mark">K</span><span><strong>Knowledge</strong><small>Productivity</small></span></a>
      <nav class="nav" aria-label="Productivity">
        <button class="nav-item is-active" data-view="today"><span>⌂</span>Today</button>
        <button class="nav-item" data-view="focus"><span>◉</span>Focus</button>
        <button class="nav-item" data-view="plan"><span>✓</span>Plan</button>
        <button class="nav-item" data-view="time"><span>◷</span>Time</button>
      </nav>
      <div class="sidebar-foot"><div id="side-clock" class="side-clock"></div><small>Local-first · no account</small></div>
    </aside>
    <main class="main">
      <header class="topbar"><div><p id="eyebrow">TODAY</p><h1 id="title">Make today clear.</h1></div><time id="now"></time></header>
      <section id="workspace" class="workspace" aria-live="polite"></section>
    </main>
  </div>
  <script src="/productivity/app.js" defer></script>
</body>
</html>
